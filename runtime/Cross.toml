# cross (https://github.com/cross-rs/cross)
#
# ## Why no custom Dockerfiles
#
# Sister repo evo-device-volumio pins its images to debian:trixie because that
# distribution's target device runs trixie and libasound2-dev must match the
# runtime symbol version. This crate has no C library dependency at all: it
# talks to /dev/spidev0.0 and /dev/i2c-1 through ioctls, and the spidev and
# i2cdev crates are pure Rust. There is nothing to link against beyond libc.
#
# ## glibc targets
#
# cross's stock images are Ubuntu 20.04, glibc 2.31. Binaries linked there run
# on anything with glibc 2.31 or newer, which covers Bookworm (2.36, Volumio 4)
# and Trixie (2.41). They do NOT run on Buster (2.28, Volumio 3), because glibc
# compatibility is forward only.
#
# ## musl targets
#
# Statically linked, no libc dependency at runtime. Run on Buster, Bookworm,
# Trixie and anything else. Prefer these for anything handed to users on mixed
# Volumio versions. Slightly larger binary, slower allocator, neither of which
# matters for a process redrawing a 240x320 buffer a few times a second.
#
# Default build targets both musl triples; see scripts/Makefile.

[target.armv7-unknown-linux-musleabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-musleabihf:main"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
