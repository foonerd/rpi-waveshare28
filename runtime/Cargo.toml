[package]
name = "waveshare28-panel"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/foonerd/rpi-waveshare28"
description = "Userspace renderer and touch reader for the Waveshare 2.8 inch SPI LCD (ST7789V + CST328) on Raspberry Pi"

# Dependency policy: this binary runs on 512 MB boards and talks to loopback.
# No HTTP client crate. `ureq` and `reqwest` both pull `url` -> `idna` -> the
# `icu_*` stack, which is a Unicode normalisation library we would carry solely
# to parse "http://localhost:3000". src/http.rs is a ~60 line GET instead.
#
# mipidsi 0.10 is required, not 0.9: the `interface::SpiInterface` type and the
# `Builder::new(model, di)` form only exist from 0.10. 0.9 has SPIInterfaceNoCS
# and a different builder.
[dependencies]
mipidsi = "0.10"
embedded-graphics = "0.8"
embedded-hal = "1"
linux-embedded-hal = { version = "0.5", features = ["gpio_cdev"] }
gpio-cdev = "0.6"
# Interface addresses for the pre-player status screen. Volumio publishes
# network *state* in /tmp/networkstatus and /data/wlan0status, but not the
# assigned addresses, so those still come from the kernel.
if-addrs = "0.13"
# Album art. Volumio's /albumart serves PNG for local files and proxies
# whatever a stream provides, so both codecs are needed. default-features off
# keeps the other twenty formats and their dependencies out of the tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# SVG. Several BBC stations serve their logo as SVG, which is a vector
# document to rasterise rather than an image format to decode, so the `image`
# crate cannot help. default-features off drops fontdb, rustybuzz and the
# unicode crates, which is most of the weight; station logos are shapes, and
# an SVG containing text renders without it rather than failing.
resvg = { version = "0.48", default-features = false }
# TLS, for album art on streaming services.
#
# rustls under the existing src/http.rs rather than an HTTP client crate:
# `ureq` and `reqwest` both pull `url` -> `idna` -> the `icu_*` stack, which is
# a Unicode normalisation library carried to parse a URL. webpki-roots embeds
# Mozilla's trust anchors so there is no system certificate store to depend on,
# which matters for a statically linked binary on an image that may not ship
# ca-certificates.
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
